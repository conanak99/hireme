<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hire Me Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f1f1ef; --panel:#ffffff; --ink:#111; --muted:#666; --line:#d9d9d5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#141414; --panel:#1d1d1d; --ink:#f2f2f2; --muted:#9a9a9a; --line:#333; }
}
:root[data-theme="dark"]{ --page:#141414; --panel:#1d1d1d; --ink:#f2f2f2; --muted:#9a9a9a; --line:#333; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 16px 40px}

/* the card is always white, like the original */
.card{container-type:inline-size;width:100%;max-width:1100px;aspect-ratio:1544/1020;background:#fff;color:#000;
  display:grid;grid-template-columns:36.8% 1fr;grid-template-rows:auto 1fr;
  padding:7.1cqw 1.5cqw 0 6cqw;overflow:hidden}
.card *{font-family:Inter,"Helvetica Neue",Arial,sans-serif}
.photo{grid-column:1;grid-row:1;width:100%;aspect-ratio:568/717;background:#ddd;overflow:hidden;cursor:pointer;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo:focus-visible{outline:3px solid #e8141b;outline-offset:3px}
.caption{grid-column:1;grid-row:2;padding:2.6cqw 0 0 3.4cqw}
.name{font-weight:800;font-size:3.7cqw;line-height:1.05;letter-spacing:-.01em;text-transform:uppercase;overflow-wrap:anywhere}
.title{font-weight:400;font-size:2.4cqw;line-height:1.2;margin-top:.5cqw;text-transform:uppercase}
.quote{grid-column:2;grid-row:1;align-self:center;text-align:center;padding-left:2cqw;
  font-weight:800;font-size:7.4cqw;line-height:1.1;text-transform:uppercase;letter-spacing:-.01em}
.quote .hot{color:#ee1c25}
.quote .mark{font-weight:500}

/* controls */
.panel{width:100%;max-width:1100px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.panel label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.panel .wide{grid-column:1/-1}
.panel input[type=text],.panel textarea{font:inherit;font-size:15px;color:var(--ink);background:transparent;
  border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
.panel textarea{resize:vertical;min-height:84px;line-height:1.4}
.panel input:focus-visible,.panel textarea:focus-visible,button:focus-visible{outline:2px solid #ee1c25;outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:14px;font-weight:500;padding:9px 14px;border-radius:6px;border:1px solid var(--ink);
  background:var(--ink);color:var(--page);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.hint{font-size:12px;color:var(--muted)}
</style>
</head>

    const d = document.createElement("div");
    if (i === 0){
      const open = document.createElement("span");
      open.className = "mark"; open.textContent = "\u201C";
      d.appendChild(open);
      const hot = document.createElement("span");
      hot.className = "hot"; hot.textContent = line;
      d.appendChild(hot);
      if (lines.length === 1){ const c = document.createElement("span"); c.className = "mark"; c.textContent = "\u201D"; d.appendChild(c); }
    } else {
      d.appendChild(document.createTextNode(line));
      if (i === lines.length - 1){ const c = document.createElement("span"); c.className = "mark"; c.textContent = "\u201D"; d.appendChild(c); }
    }
    box.appendChild(d);
  });
}

function setDefaults(){
  inName.value = DEFAULTS.name;
  inTitle.value = DEFAULTS.title;
  inQuote.value = DEFAULTS.quote;
  $("img").src = DEFAULT_IMG;
  render();
}

[inName, inTitle, inQuote].forEach(el => el.addEventListener("input", render));

const fileInput = $("file");
const pick = () => fileInput.click();
$("upload").addEventListener("click", pick);
$("photo").addEventListener("click", pick);
$("photo").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); } });
fileInput.addEventListener("change", () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { $("img").src = r.result; };
  r.readAsDataURL(f);
  fileInput.value = "";
});
$("reset").addEventListener("click", setDefaults);

setDefaults();
</script>
</body>
</html>
